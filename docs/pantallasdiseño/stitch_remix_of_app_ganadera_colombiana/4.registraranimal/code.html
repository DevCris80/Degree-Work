nsition-colors -ml-2" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="font-headline-sm text-headline-sm text-on-surface truncate">Registrar Animal</h1></div><div class="flex items-center gap-space-sm flex-shrink-0"><img alt="Profile" class="w-8 h-8 rounded-full object-cover" src="https://lh3.googleusercontent.com/aida/AEtjO1UysQtKfizsD3OYpThBEDMcPZ_R02SBsQeu0r1uLErPaRxuU0V3VBTgvLpRF19yKza4dX0RmbsYMX9EtLBkTGwcDJfMq-E_yA-0BwUVah_-RVVWPkVx2sHdhRG-i803kfYF0I9DJqcXYqWnRwm1jKI1eJXMu6IPlypxIQa7QHow5IDCwLEZgksSDvlajAQuPRAfb46q4hWg4xUWkcm5jwIkqJ5wKc08epftDBFkgiOnvfRmQEd4NuviGuR4ITGrPgkzrcfMfmGZHA"></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 pb-safe px-gutter bg-surface"><div class="flex flex-col w-full pb-10">
<!-- Banner Informativo -->
<section class="mb-4">
<div class="bg-surface-container-high/90 rounded-2xl p-space-md flex items-start gap-space-sm shadow-sm transition-all">
<div class="w-8 h-8 rounded-full bg-primary/10 flex items-center justify-center flex-shrink-0 text-primary mt-0.5">

<!-- Sección Fotografía del Ejemplar -->

<!-- Formulario de Campo -->
<form class="flex flex-col gap-space-md" id="register-animal-form">
<!-- Nombre o Apodo -->
<div class="flex flex-col gap-1.5">
<label class="font-label-lg text-label-lg text-on-surface px-1" for="animal-name">

      </label>
<div class="relative flex items-center">
<div class="absolute left-4 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[22px]">face</span>
</div>
<input class="w-full h-14 pl-12 pr-4 rounded-2xl bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-lg text-body-lg focus:outline-none focus:bg-surface-container-low shadow-sm transition-all" id="animal-name" placeholder="Ej. Gitana, Barcino 108" type="text">
</div>
</div>
<!-- Arete / Chapeta con escáner QR/NFC -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between px-1">
<label class="font-label-lg text-label-lg text-on-surface" for="animal-tag">
          Número de chapeta / arete
        </label>
<span class="font-body-sm text-body-sm text-on-surface-variant font-medium">(Opcional)</span>
</div>
<div class="relative flex items-center">
<div class="absolute left-4 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[22px]">tag</span>
</div>
<input class="w-full h-14 pl-12 pr-14 rounded-2xl bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-lg text-body-lg focus:outline-none focus:bg-surface-container-low shadow-sm uppercase transition-all" id="animal-tag" placeholder="Ej. COL-0428" type="text">
<button class="absolute right-2.5 w-10 h-10 rounded-xl bg-surface-container hover:bg-secondary-container text-on-surface-variant flex items-center justify-center active:scale-95 transition-all" id="scan-tag-btn" title="Escanear Arete o Código" type="button">
<span class="material-symbols-outlined text-[22px] text-primary">qr_code_scanner</span>
</button>
</div>
</div>
<!-- Raza principal -->
<div class="flex flex-col gap-1.5">
<label class="font-label-lg text-label-lg text-on-surface px-1" for="animal-breed">
        Raza principal
      </label>
<div class="relative flex items-center">
<div class="absolute left-4 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[22px]">verified</span>
</div>
<select class="w-full h-14 pl-12 pr-12 rounded-2xl bg-surface-container-lowest text-on-surface font-body-lg text-body-lg focus:outline-none focus:bg-surface-container-low shadow-sm appearance-none cursor-pointer transition-all" id="animal-breed">
<option disabled="" selected="" value="">Seleccionar raza principal</option>
<option value="brahman">Brahman Blanco / Rojo</option>
<option value="girolando">Girolando</option>
<option value="cebu">Cebú Comercial</option>
<option value="simmental">Simmental / Simbrah</option>
<option value="normando">Normando</option>
<option value="bon">Blanco Orejinegro (BON)</option>
<option value="angus">Brangus / Angus</option>
<option value="otro">Otro / Mestizo</option>
</select>
<div class="absolute right-4 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[24px]">expand_more</span>
</div>
</div>
</div>
<!-- Sexo del ejemplar -->
<div class="flex flex-col gap-1.5">
<label class="font-label-lg text-label-lg text-on-surface px-1">
        Sexo del ejemplar
      </label>
<div aria-label="Sexo del ejemplar" class="grid grid-cols-2 gap-space-sm" role="radiogroup">
<button class="sex-chip h-14 rounded-2xl bg-surface-container-lowest text-on-surface flex items-center justify-center gap-space-xs font-label-lg text-label-lg shadow-sm active:scale-98 transition-all" data-sex="macho" type="button">
<span class="material-symbols-outlined text-[20px]">male</span>
<span>Macho</span>
</button>
<button class="sex-chip h-14 rounded-2xl bg-secondary-container text-on-secondary-fixed font-bold flex items-center justify-center gap-space-xs font-label-lg text-label-lg shadow-sm active:scale-98 transition-all" data-sex="hembra" type="button">
<span class="material-symbols-outlined text-[20px]">female</span>
<span>Hembra</span>
</button>
</div>
</div>
<!-- Fecha de Nacimiento -->
<div class="flex flex-col gap-2">
<label class="font-label-lg text-label-lg text-on-surface px-1" for="birth-date">
        Fecha de nacimiento
      </label>
<div class="relative flex items-center">
<div class="absolute left-4 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[22px]">calendar_today</span>
</div>
<input class="w-full h-14 pl-12 pr-4 rounded-2xl bg-surface-container-lowest text-on-surface font-body-lg text-body-lg focus:outline-none focus:bg-surface-container-low shadow-sm transition-all" id="birth-date" type="date">
</div>
<!-- Checkbox Fecha Estimada -->
<label class="flex items-center gap-3 px-1 py-1 cursor-pointer select-none">
<input class="w-5 h-5 rounded-lg accent-primary cursor-pointer" id="estimated-date" type="checkbox">
<span class="font-body-md text-body-md text-on-surface">Fecha aproximada / estimada</span>
</label>
</div>
<!-- Propósito Productivo -->
<div class="flex flex-col gap-1.5">
<label class="font-label-lg text-label-lg text-on-surface px-1">
        Propósito productivo
      </label>
<div aria-label="Propósito productivo" class="grid grid-cols-3 gap-2" role="radiogroup">
<button class="purpose-chip h-14 rounded-2xl bg-surface-container-lowest text-on-surface flex flex-col items-center justify-center shadow-sm active:scale-95 transition-all px-2" data-purpose="leche" type="button">
<span class="font-label-md text-label-md">Leche</span>
</button>
<button class="purpose-chip h-14 rounded-2xl bg-surface-container-lowest text-on-surface flex flex-col items-center justify-center shadow-sm active:scale-95 transition-all px-2" data-purpose="carne" type="button">
<span class="font-label-md text-label-md">Carne</span>
</button>
<button class="purpose-chip h-14 rounded-2xl bg-secondary-container text-on-secondary-fixed font-bold flex flex-col items-center justify-center shadow-sm active:scale-95 transition-all px-2 text-center" data-purpose="doble" type="button">
<span class="font-label-sm text-label-sm leading-tight">Doble Propósito</span>
</button>
</div>
</div>
<!-- Lote y Peso Inicial (Datos tácticos de campo) -->
<div class="grid grid-cols-2 gap-space-sm pt-1">
<div class="flex flex-col gap-1.5 min-w-0">
<label class="font-label-md text-label-md text-on-surface px-1 truncate" for="assigned-lot">
          Lote / Potrero
        </label>
<div class="relative flex items-center">
<select class="w-full h-14 pl-3 pr-8 rounded-2xl bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:outline-none focus:bg-surface-container-low shadow-sm appearance-none cursor-pointer truncate" id="assigned-lot">
<option value="potrero-1">Potrero Las Brisas</option>
<option value="potrero-2">Lote Ceba 01</option>
<option value="potrero-3">Maternidad</option>
<option value="potrero-4">Levante Norte</option>
</select>
<div class="absolute right-2.5 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">arrow_drop_down</span>
</div>
</div>
</div>
<div class="flex flex-col gap-1.5 min-w-0">
<label class="font-label-md text-label-md text-on-surface px-1 truncate" for="initial-weight">
          Peso inicial (kg)
        </label>
<div class="relative flex items-center">
<input class="w-full h-14 pl-4 pr-10 rounded-2xl bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:outline-none focus:bg-surface-container-low shadow-sm" id="initial-weight" placeholder="Ej. 340" step="0.5" type="number">
<span class="absolute right-3.5 font-label-sm text-label-sm text-on-surface-variant pointer-events-none">
            kg
          </span>
</div>
</div>
</div>
<!-- Botones de Acción -->
<div class="flex flex-col gap-3 pt-6 pb-2">
<button class="w-full h-14 rounded-full bg-primary text-on-primary font-headline-sm text-headline-sm flex items-center justify-center gap-space-xs shadow-md active:bg-primary-container active:scale-98 transition-all" id="btn-submit" type="button">
<span class="material-symbols-outlined text-[22px]">check_circle</span>
<span>Guardar animal</span>
</button>
<button class="w-full py-3 flex items-center justify-center text-on-surface-variant hover:text-on-surface font-label-lg text-label-lg active:scale-95 transition-colors" onclick="history.back()" type="button">
        Cancelar y volver
      </button>
</div>
</form>
<!-- Notificación Toast Dinámica -->
<div class="fixed bottom-6 left-4 right-4 z-50 transform translate-y-32 transition-transform duration-300 pointer-events-none" id="status-toast">
<div class="bg-inverse-surface text-inverse-on-surface px-4 py-3 rounded-2xl shadow-xl flex items-center justify-between">
<div class="flex items-center gap-space-xs">
<span class="material-symbols-outlined text-[20px] text-primary-fixed" id="toast-icon">check</span>
<span class="font-body-md text-body-md" id="toast-message">Animal guardado con éxito</span>
</div>
</div>
</div>
</div>
<script>
  (function () {
    // Interacción Selección de Sexo
    const sexButtons = document.querySelectorAll('.sex-chip');
    sexButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        sexButtons.forEach((b) => {
          b.className = 'sex-chip h-14 rounded-2xl bg-surface-container-lowest text-on-surface flex items-center justify-center gap-space-xs font-label-lg text-label-lg shadow-sm active:scale-98 transition-all';
        });
        btn.className = 'sex-chip h-14 rounded-2xl bg-secondary-container text-on-secondary-fixed font-bold flex items-center justify-center gap-space-xs font-label-lg text-label-lg shadow-sm active:scale-98 transition-all';
      });
    });

    // Interacción Propósito Productivo
    const purposeButtons = document.querySelectorAll('.purpose-chip');
    purposeButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        purposeButtons.forEach((b) => {
          b.className = 'purpose-chip h-14 rounded-2xl bg-surface-container-lowest text-on-surface flex flex-col items-center justify-center shadow-sm active:scale-95 transition-all px-2';
        });
        btn.className = 'purpose-chip h-14 rounded-2xl bg-secondary-container text-on-secondary-fixed font-bold flex flex-col items-center justify-center shadow-sm active:scale-95 transition-all px-2 text-center';
      });
    });

    // Simulación Foto Mock
    const takePhotoBtn = document.getElementById('btn-take-photo');
    const openGalleryBtn = document.getElementById('btn-open-gallery');
    const photoPreview = document.getElementById('photo-preview');
    const photoEmptyState = document.getElementById('photo-empty-state');
    const removePhotoBtn = document.getElementById('btn-remove-photo');
    const toast = document.getElementById('status-toast');
    const toastMsg = document.getElementById('toast-message');

    function showPhoto() {
      photoEmptyState.classList.add('hidden');
      photoPreview.classList.remove('hidden');
      removePhotoBtn.classList.remove('hidden');
      removePhotoBtn.classList.add('flex');
    }

    function clearPhoto() {
      photoPreview.classList.add('hidden');
      photoEmptyState.classList.remove('hidden');
      removePhotoBtn.classList.add('hidden');
      removePhotoBtn.classList.remove('flex');
    }

    if (takePhotoBtn) takePhotoBtn.addEventListener('click', showPhoto);
    if (openGalleryBtn) openGalleryBtn.addEventListener('click', showPhoto);
    if (removePhotoBtn) removePhotoBtn.addEventListener('click', clearPhoto);

    // Escaneo Rápido Simulado
    const scanTagBtn = document.getElementById('scan-tag-btn');
    const tagInput = document.getElementById('animal-tag');
    if (scanTagBtn && tagInput) {
      scanTagBtn.addEventListener('click', () => {
        const randomNum = Math.floor(1000 + Math.random() * 9000);
        tagInput.value = `COL-2024-${randomNum}`;
        triggerToast('Arete escaneado correctamente');
      });
    }

    // Submit Guardar Animal
    const submitBtn = document.getElementById('btn-submit');
    function triggerToast(message) {
      if (!toast || !toastMsg) return;
      toastMsg.textContent = message;
      toast.classList.remove('translate-y-32');
      toast.classList.add('translate-y-0');
      setTimeout(() => {
        toast.classList.remove('translate-y-0');
        toast.classList.add('translate-y-32');
      }, 2600);
    }

    if (submitBtn) {
      submitBtn.addEventListener('click', () => {
        const nameVal = document.getElementById('animal-name')?.value || 'Ejemplar sin nombre';
        triggerToast(`¡${nameVal} registrado exitosamente!`);
        setTimeout(() => {
          if (window.history.length > 1) {
            window.history.back();
          }
        }, 1200);
      });
    }
  })();
</script></main></body></html>
