tLength="59.4361" x="1268.37" y="957.2049">id_lectura</text></g><g class="legend" data-source-line="208"><rect fill="#DDDDDD" height="162.5433" rx="3" ry="3" style="stroke:#000000;stroke-width:1;" width="790.8892" x="12" y="1283.1908"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="724.0931" x="17" y="1303.1568">&#9679; NOT NULL &#183; sin &#9679; admite NULL. Todas las tablas tienen RLS por finca y rol; ninguna pol&#237;tica permite DELETE.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="731.1335" x="17" y="1322.2247">cursor_descarga: valor nuevo de una secuencia global en cada escritura (trigger), para la descarga incremental.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="602.8939" x="17" y="1341.2926">id_perfil_finca en las tablas hijas lo llena un trigger, para filtrar por finca sin unir con animal.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="780.8892" x="17" y="1360.3605">Por simplicidad no se dibujan las FK hacia perfil_finca de chapeta, evento, registro, pesaje_pendiente, revision y sibling.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="550.9259" x="17" y="1379.4284">Sin sincronizado, rev_base ni id_version en las filas: son estado local de cada celular.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="544.9341" x="17" y="1398.4964">Fotos: bucket &#171;fotos&#187; de Storage, un archivo &lt;finca&gt;/&lt;id_animal&gt;.webp por animal.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="778.5934" x="17" y="1417.5643">aceptacion_datos e invitacion solo existen en el servidor: ni se leen ni se escriben por la API, y no viajan en la descarga.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="599.7437" x="17" y="1436.6322">usuario.fecha_quitado: el Ganadero quit&#243; al Operario de la finca; la fila se conserva (RN-04).</text></g><?plantuml-src nLZBJXn75DtFLrmv6o33sCIF91WXOJm4omHZOolBKKrtpL3GNTMkwXw_Y9HjLjb4oXTa4KLPUH4fsPa_yPVatEh7TFSyZ8YT82IegjltSUwpAbLf9EbR4yh8aDIf2aMuRcKa0dNnLjFx7twceN2IGloAr3WAG6H5H2j7ngLZAuyV7-0xEiuImOIhdSw90d6WR139ZZjJEX5MnEHEH6XUA3scaOXS_IIK8v55wPxHwQ689JcXtRgJLergHDPaEWoCrTBIdTf-40ddw4s7w9u8piQURDT4nj9dU_w7JumDfIrsR_U_tBkzWzrzAR0xyzNztVwz-pSxtzTaC2pfgqyiPCTQyw8ulkb_QeU79fNpH7-rUwTDLLVZtksTExU-w7GA0ww9B3tfPO3MNIFXY9S3lwIjhTA1j8FTxMrlxPeAQPEo37-sjeuURcz3uv9P8kr8HOEHqe4eYGUDpUQNHElhJALDFBIo8adbonJRaG3JZAM59XiY8XCh0-MKqNnez7ZnwTf81YTY49jGZLI0k3MQ-QfOkbJ4IVgQQOBCEcC7eNI1i6CMF5HZfTEQGPdBX5McigLSrypeqjv3ce9OisgXxNkvxONPKuFNh8cA5QXsz_kx3-aReJbQ39tJ8t1ZwVxZtC3dcKgHGhEsVIJxXLOnyheqlrZET-A7pELp4NfxguD2G7aUBpiluEgI5QzhKRBcv4lJ9PcAH7GH12OnJgMcXMENdXoktxYPCyh1qO0bLZ1q8NnJYe5q-0MH23rEnaHIwCeDGt4ghkO3AoVO1EXoZ2AsjVN-nrzf8zVo4kwH4wz-wPvYkT0zRVULSJWli6jdouCuLOaf97THjbCHHVMGzY3Cs3rKA4PZ5V0dS9VhqaJLV0gXWLLYOAL34n10PohNAKs5x8yA_YKXjtAiN6gde5SR_odiE8zaa6QsdWc9TCpAIaWhwmTtPaatw1LjtBvnWyx6zHI8PQZcGlD_80kk2SAd0hPSpySrWFnnEyj96mkerMlKn0h79V0lZ-pSKE5CeCGIb63J4fgFLOdXMt4geR4EkIB9Mdjj7IoCmo9WkjJ0hXKubmYEVrSlOfEgITjn_WZPRgAi5Da-dGeTD0YRx7FLcvm-YJyGuNxOgFmmGVDlQDI0lvYYfuOLKNbUrl3pgh9KE0B44hzB8JkRT9YUfLP-FZXrHWyNEw_B8uonjS1leJArtAbXn2FxLGo_kcK3FuT-FFCG8u5CvhgVkuwCqFGJpCkLbX-EhClCKv2P-g0Rv3UdQhAg3XRdxnoxseFdMk6C0ODTIp9G9bPDK1Px_cJWuK2TP8cDQbVNOxx_bPweWgJKlhPrjTbmffm_Etpm-5c_Ix5uTV6N2pBSwDfD4oC2BbALY-RZaLl5bCkg0L9muInO5oZqgLmchf1MaBNWgzsipi_NryrvURkOENap4oTpI1gOiu4D6kC5D6bOBT5f-666rzpZKizvPtaTwvJbpDGs8JCV-A-J7-mhelpBlF2rDiiYsDekPe5EcG9D5gtTYaThVqwdv2lZK4u9pI92r9f0HKhCoYhQm6PUOThdPR4iZwjfyTpqUl3G757JJjtfQDpUSTj8KnEJ6LKm4ENviTBAgxArhuBYk_t-a_xS4UN1CHq-EpYW5RuIRQmYhqDYGJFYAY0NovigkyelFhKlNl5wnZmlysj_6_jYkUX9UPVV1qVKAWH3OE8aaiZHK18AGaKaNP4meS1DWYy8eKoWad-k0WSMkd5djLU-PT7dL3OXaMGQ5mmIO4X-PsNwq1LTlCKTHUGiznwkzi3hm13gkq