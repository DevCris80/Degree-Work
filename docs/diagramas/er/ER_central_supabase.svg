st="spacing" textLength="33.254" x="789.06" y="586.3149">autor</text></g><!--link registro to pesaje_pendiente--><g class="link" data-entity-1="ent0007" data-entity-2="ent0009" data-link-type="association" data-source-line="169" id="lnk27"><path codeLine="169" d="M1309.6937,889.6624 C1303.9437,894.5324 1309.68,889.6279 1304.06,894.3079 C1255.24,934.8679 1212.1869,969.0403 1164.3469,1006.1103" fill="none" id="registro-pesaje_pendiente" style="stroke:#333333;stroke-width:1;stroke-dasharray:7,7;"/><line style="stroke:#333333;stroke-width:1;" x1="1312.7461" x2="1321.14" y1="887.0772" y2="879.9679"/><ellipse cx="1312.7461" cy="887.0772" fill="none" rx="4" ry="4" style="stroke:#333333;stroke-width:1;"/><line style="stroke:#333333;stroke-width:1;" x1="1315.5025" x2="1320.6729" y1="879.5008" y2="885.6055"/><line style="stroke:#333333;stroke-width:1;" x1="1161.1851" x2="1152.49" y1="1008.5603" y2="1015.2979"/><ellipse cx="1161.1851" cy="1008.5603" fill="none" rx="4" ry="4" style="stroke:#333333;stroke-width:1;"/><line style="stroke:#333333;stroke-width:1;" x1="1158.1019" x2="1153.2018" y1="1016.0097" y2="1009.686"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="59.4361" x="1268.37" y="939.2049">id_lectura</text></g><g class="legend" data-source-line="192"><rect fill="#DDDDDD" height="143.4754" rx="3" ry="3" style="stroke:#000000;stroke-width:1;" width="790.8892" x="12" y="1265.1908"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="724.0931" x="17" y="1285.1568">&#9679; NOT NULL &#183; sin &#9679; admite NULL. Todas las tablas tienen RLS por finca y rol; ninguna pol&#237;tica permite DELETE.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="731.1335" x="17" y="1304.2247">cursor_descarga: valor nuevo de una secuencia global en cada escritura (trigger), para la descarga incremental.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="602.8939" x="17" y="1323.2926">id_perfil_finca en las tablas hijas lo llena un trigger, para filtrar por finca sin unir con animal.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="780.8892" x="17" y="1342.3605">Por simplicidad no se dibujan las FK hacia perfil_finca de chapeta, evento, registro, pesaje_pendiente, revision y sibling.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="550.9259" x="17" y="1361.4284">Sin sincronizado, rev_base ni id_version en las filas: son estado local de cada celular.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="544.9341" x="17" y="1380.4964">Fotos: bucket &#171;fotos&#187; de Storage, un archivo &lt;finca&gt;/&lt;id_animal&gt;.webp por animal.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="366.9246" x="17" y="1399.5643">Planificada y a&#250;n sin migraci&#243;n: tabla invitacion (RN-18).</text></g><?plantuml-src nLXBRnn54BxlhoY5YzUiDpR19fYL9SVPnP6Dyt0YZglQcTvnsptTG_VCvcKahfou8F4BE234AGSakCN_9B-4gfx7piu-OWK7B4jsTrNNuwj7LqygKoNW6nCAPK3eL8OORbYXC91NRpIy--5d6A4J4D8lfiP1G4mM5QmzCYwDh3XzV4pdu3HBa1dRhTQP9EP0sa29bhkGEa6BCRWp3CrpgICOet9rIYZ6cAbqO7HwWh40XzfjE67bkCPaJQR3m5WjBEpKzWE5pi7h5i0z32uYptPWbB7moS3_CCNOKDXYTxl_nM1xdtOF1TBktAdx1_rxz--qlg_fO5ZIbnzPoRwrvdb1lkD_QiGJauf5gkyUx3IvwcRSszxV-VopLgjmu1PcwLat8sZTBK07l1pw9VHwPG1XdtRtzhotwpA4NSWo-jFhFJhQsoEBIs69i6EfXcEf0ooPXpERioS1DZQOIvjuP4N5aeeNAMqh9A4PQmjDDgACJAm8f9D6Cz7eQ3brVIo2Cnp69fHZ6L3U6iroPInSYd6IlcAU8BFEs64eN80sOiKZ6KcTrXpAN8PMcigNSbrpemE38vY2MFDggU-3tFV2xQd3wzQeOaLS1uVzWoFu6ZLdYu5BU4ZIM7j--8OyH2rZgjpImMAvE4plSuZf67gFAaAXeAJ7g-W581sm-AgM1-jEl30T42acsA4mcyGucPe6KXruShAnUQSEZYPOOacEcdbecXn3uUYNc33qE1cZ178gvOmZFCTbGbR7m8e9RHBe8g8srUkz-_5NsCgjl4PunCIRNuQdM2uDJpDyPQOjIjqQRNMQfZ8nXUOEDUOKbQedhGTXpk-Hf7OJoO2FKBXS1oQo5bDI6bY9GoiSjNaa