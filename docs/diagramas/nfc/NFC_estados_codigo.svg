<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="969px" preserveAspectRatio="none" style="width:841px;height:969px;background:#FFFFFF;" version="1.1" viewBox="0 0 841 969" width="841px" zoomAndPan="magnify"><title>Esquema de identificaci&#243;n NFC &#8212; m&#225;quina de estados de un c&#243;digo</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="469.7579" x="178.9042" y="24.9659">Esquema de identificaci&#243;n NFC &#8212; m&#225;quina de estados de un c&#243;digo</text></g><g class="entity" data-qualified-name="SinHistorial" id="ent0002"><rect fill="#FFFFFF" height="88.1003" rx="3" ry="3" style="stroke:#5B6B86;stroke-width:0.5;" width="311.5552" x="39.74" y="127.0679"/><line style="stroke:#5B6B86;stroke-width:0.5;" x1="39.74" x2="351.2952" y1="156.1358" y2="156.1358"/><text fill="#222222" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="76.9437" x="157.0457" y="147.0339">Sin historial</text><text fill="#222222" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="228.7096" x="44.74" y="173.9639">no existe ninguna Chapeta con el c&#243;digo</text><text fill="#222222" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="196.9825" x="44.74" y="190.308">escanear &#8594; registrar animal nuevo</text><text fill="#222222" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="291.5552" x="44.74" y="206.6522">pesaje &#8594; pendiente CODIGO_SIN_CHAPETA_ACTIVA</text></g><path d="M36.21,312.1679 L354.8331,312.1679 A3,3 0 0 1 357.8331,315.1679 L357.8331,341.2358 L33.21,341.2358 L33.21,315.1679 A3,3 0 0 1 36.21,312.1679" fill="#FFFFFF"/><rect fill="none" height="323.5741" rx="3" ry="3" style="stroke:#5B6B86;stroke-width:0.5;" width="324.6231" x="33.21" y="312.1679"/><line style="stroke:#5B6B86;stroke-width:0.5;" x1="33.21" x2="357.8331" y1="341.2358" y2="341.2358"/><text fill="#222222" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="39.2979" x="175.8726" y="332.1339">Activa</text><g class="entity" data-qualified-name="Activa.AnimalActivo" id="ent0004"><rect fill="#FFFFFF" height="71.7561" rx="3" ry="3" style="stroke:#5B6B86;stroke-width:0.5;" width="231.7426" x="81.15" y="409.2358"/><line style="stroke:#5B6B86;stroke-width:0.5;" x1="81.15" x2="312.8926" y1="438.3038" y2="438.3038"/><text fill="#222222" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="88.2277" x="152.9075" y="429.2018">Animal activo</text><text fill="#222222" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="211.7426" x="86.15" y="456.1318">escanear &#8594; abrir el detalle del animal</text><text fill="#222222" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="193.8745" x="86.15" y="472.476">pesaje &#8594; Registro del animal (201)</text></g><g class="entity" data-qualified-name="Activa.AnimalBaja" id="ent0005"><rect fill="#FFFFFF" height="71.7561" rx="3" ry="3" style="stroke:#5B6B86;stroke-width:0.5;" width="303.6231" x="45.21" y="553.9858"/><line style="stroke:#5B6B86;stroke-width:0.5;" x1="45.21" x2="348.8331" y1="583.0538" y2="583.0538"/><text fill="#222222" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="134.6655" x="129.6888" y="573.9518">Animal dado de baja</text><text fill="#222222" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="210.4586" x="50.21" y="600.8818">escanear &#8594; ofrecer liberar la chapeta</text><text fill="#222222" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="283.6231" x="50.21" y="617.226">pesaje &#8594; pendiente ANIMAL_DADO_DE_BAJA (202)</text></g><g class="start_entity" data-qualified-name="Activa..start.Activa" data-source-line="30" id="ent0002"><ellipse cx="197.02" cy="362.2358" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><!--link *start*Activa to AnimalActivo--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" data-source-line="30" id="lnk3"><path d="M197.02,372.5158 C197.02,381.4758 197.02,389.6158 197.02,402.9758" fill="none" id="*start*Activa-to-AnimalActivo" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="197.02,408.9758,201.02,399.9758,197.02,403.9758,193.02,399.9758,197.02,408.9758" style="stroke:#333333;stroke-width:1;"/></g><!--link AnimalActivo to AnimalBaja--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="31" id="lnk4"><path d="M197.02,481.3958 C197.02,503.3658 197.02,525.5158 197.02,547.4958" fill="none" id="AnimalActivo-to-AnimalBaja" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="197.02,553.4958,201.02,544.4958,197.02,548.4958,193.02,544.4958,197.02,553.4958" style="stroke:#333333;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.6081" x="198.02" y="513.8828">dar de baja el animal</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="114.2701" x="204.689" y="531.5889">[Ganadero] (RF-11)</text></g><g class="entity" data-qualified-name="Liberada" id="ent0006"><rect fill="#FFFFFF" height="88.1003" rx="3" ry="3" style="stroke:#5B6B86;stroke-width:0.5;" width="348.1435" x="21.44" y="732.7479"/><line style="stroke:#5B6B86;stroke-width:0.5;" x1="21.44" x2="369.5835" y1="761.8158" y2="761.8158"/><text fill="#222222" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="57.5538" x="166.7349" y="752.7139">Liberada</text><text fill="#222222" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="262.2739" x="26.44" y="779.6439">todas sus Chapetas tienen fechaDesasociacion</text><text fill="#222222" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="328.1435" x="26.44" y="795.988">escanear &#8594; registrar animal, con aviso del animal anterior</text><text fill="#222222" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="291.5552" x="26.44" y="812.3322">pesaje &#8594; pendiente CODIGO_SIN_CHAPETA_ACTIVA</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="39" id="ent0005"><ellipse cx="195.52" cy="56.0679" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN2" data-source-line="47" id="ent0003"><path d="M392.47,356.8679 L392.47,469.9579 L357.98,473.9579 L392.47,477.9579 L392.47,591.0461 A3,3 0 0 0 395.47,594.0461 L831.5663,594.0461 A3,3 0 0 0 834.5663,591.0461 L834.5663,363.8679 L824.5663,353.8679 L395.47,353.8679 A3,3 0 0 0 392.47,356.8679" fill="#FFF8C6" style="stroke:#B5A642;stroke-width:0.5;"/><path d="M824.5663,353.8679 L824.5663,362.3679 A1.5,1.5 0 0 0 826.0663,363.8679 L834.5663,363.8679 L824.5663,353.8679" fill="#FFF8C6" style="stroke:#B5A642;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="280.2412" x="398.47" y="372.7649">Invariante: en este estado existe exactamente</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="325.5462" x="398.47" y="390.4709">una Chapeta con el c&#243;digo y fechaDesasociacion nula</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.6662" x="398.47" y="408.177">(&#237;ndice &#250;nico parcial, RN-01).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="294.5672" x="398.47" y="425.883">Un intento de asociarlo a otro animal se rechaza</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="106.2881" x="398.47" y="443.589">(CodigoYaActivo).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="209.3782" x="398.47" y="461.295">En el servidor la regla es por finca:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="421.0963" x="398.47" y="479.001">UNIQUE(id_perfil_finca, codigo) WHERE fecha_desasociacion IS NULL.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="375.8174" x="398.47" y="496.707">Si dos celulares asocian el mismo c&#243;digo sin se&#241;al, la Chapeta</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="358.2673" x="398.47" y="514.4131">que sube segunda se rechaza (23505): sale de la tabla local</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="285.3112" x="398.47" y="532.1191">y pasa a la bandeja de rechazos con su motivo.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="316.1602" x="398.47" y="549.8251">Si la local ya estaba sincronizada, al descargar la del</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="318.2532" x="398.47" y="567.5311">servidor la local se libera (cede el c&#243;digo) y el c&#243;digo</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="326.4042" x="398.47" y="585.2371">sigue Activo, ahora con el animal que trae el servidor.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="63" id="ent0006"><path d="M6,884.8479 L6,959.672 A3,3 0 0 0 9,962.672 L382.0333,962.672 A3,3 0 0 0 385.0333,959.672 L385.0333,891.8479 L375.0333,881.8479 L199.52,881.8479 L195.52,821.2279 L191.52,881.8479 L9,881.8479 A3,3 0 0 0 6,884.8479" fill="#FFF8C6" style="stroke:#B5A642;stroke-width:0.5;"/><path d="M375.0333,881.8479 L375.0333,890.3479 A1.5,1.5 0 0 0 376.5333,891.8479 L385.0333,891.8479 L375.0333,881.8479" fill="#FFF8C6" style="stroke:#B5A642;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="297.9992" x="12" y="900.7449">El historial no se pierde: cada asociaci&#243;n anterior</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="341.7443" x="12" y="918.4509">queda como una fila de Chapeta con sus fechas (RN-04).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="268.5413" x="12" y="936.157">No hay transici&#243;n de vuelta a &#171;Sin historial&#187;.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="358.0333" x="12" y="953.863">Las transiciones por sincronizaci&#243;n solo ocurren con se&#241;al.</text></g><!--link *start* to SinHistorial--><g class="link" data-entity-1="ent0005" data-entity-2="ent0002" data-link-type="dependency" data-source-line="39" id="lnk6"><path d="M195.52,66.3179 C195.52,79.5079 195.52,98.5579 195.52,120.7479" fill="none" id="*start*-to-SinHistorial" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="195.52,126.7479,199.52,117.7479,195.52,121.7479,191.52,117.7479,195.52,126.7479" style="stroke:#333333;stroke-width:1;"/></g><!--link SinHistorial to Activa--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="40" id="lnk7"><path d="M105.47,215.6479 C95.5,224.0779 86.72,233.8679 80.52,245.1679 C72.6,259.5779 76.11,266.3279 80.52,282.1679 C83.26,292.0479 84.4407,296.3475 88.3507,306.1175" fill="none" id="SinHistorial-to-Activa" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="90.58,311.6879,90.9497,301.846,88.7222,307.0459,83.5224,304.8184,90.58,311.6879" style="stroke:#333333;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.1432" x="82.274" y="260.0649">registrar animal con el c&#243;digo</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="183.6512" x="81.52" y="277.7709">(escaneado o digitado) (RF-17)</text></g><!--link SinHistorial to Activa--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="41" id="lnk8"><path d="M250.07,215.3579 C257.99,224.3079 264.99,234.3479 269.52,245.1679 C278.42,266.4579 280.7721,283.2804 277.7621,305.8804" fill="none" id="SinHistorial-to-Activa-1" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="276.97,311.8279,282.1232,303.4348,277.6301,306.8717,274.1932,302.3786,276.97,311.8279" style="stroke:#333333;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.8791" x="304.0385" y="260.0649">asociar a un animal existente</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="227.9162" x="279.02" y="277.7709">sin chapeta activa (RF-19, planificado)</text></g><!--link Activa to Liberada--><g class="link" data-entity-1="ent0003" data-entity-2="ent0006" data-link-type="dependency" data-source-line="42" id="lnk9"><path d="M32.71,624.5279 C21.42,650.3779 20.12,677.1679 36.52,702.7479 C43.98,714.3779 48.9934,720.6101 60.1134,728.8701" fill="none" id="Activa-to-Liberada" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="64.93,732.4479,60.0903,723.8702,60.9162,729.4664,55.3199,730.2923,64.93,732.4479" style="stroke:#333333;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="92.3261" x="48.492" y="680.6449">liberar chapeta</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="114.2701" x="37.52" y="698.3509">[Ganadero] (RF-18)</text></g><!--link Liberada to Activa--><g class="link" data-entity-1="ent0006" data-entity-2="ent0003" data-link-type="dependency" data-source-line="43" id="lnk10"><path d="M193.45,732.5379 C193.06,722.7479 192.71,712.3879 192.52,702.7479 C192.07,681.1979 191.9386,664.4979 192.0186,642.1179" fill="none" id="Liberada-to-Activa" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="192.04,636.1179,188.0079,645.1036,192.0221,641.1179,196.0078,645.1322,192.04,636.1179" style="stroke:#333333;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="256.3862" x="225.0905" y="680.6449">registrar otro animal con el c&#243;digo (RF-17)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="319.5273" x="193.52" y="698.3509">o asociarlo a un animal existente (RF-19, planificado)</text></g><!--link Liberada to Activa--><g class="link" data-entity-1="ent0006" data-entity-2="ent0003" data-link-type="dependency" data-source-line="44" id="lnk11"><path d="M369.74,755.8879 C434.77,744.5579 497.71,727.5479 517.52,702.7479 C527.78,689.8979 527.88,678.5079 517.52,665.7479 C476.58,615.3279 432.43,665.1179 374.52,635.7479 C369.02,632.9579 368.7426,632.9984 363.3326,629.8184" fill="none" id="Liberada-to-Activa-1" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="358.16,626.7779,363.8919,634.787,362.4705,629.3116,367.9458,627.8902,358.16,626.7779" style="stroke:#333333;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.3721" x="528.564" y="680.6449">al sincronizar, el servidor rechaza</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.0002" x="526.25" y="698.3509">la liberaci&#243;n y devuelve su versi&#243;n</text></g><?plantuml-src bLRDRjj64BxpAGRfHIhi875Yr_MX02NBiG9NRksuHH47mefSIUjGkyekgSGf0lJK1oZw0ZqNFHIvjRVeJV8a_MQNf6XBDb0T12vtv-VxvfjPvYhF9FNScqBE1AMI