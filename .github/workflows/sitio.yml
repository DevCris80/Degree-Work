name: Sitio

# Publica la carpeta `sitio/` en GitHub Pages: la política de privacidad y la página de eliminación de cuenta
# que Google Play pide como URL. No publica `docs/`.
on:
  push:
    branches: [main]
    paths: [sitio/**, .github/workflows/sitio.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - id: despliegue
        uses: actions/deploy-pages@v4
